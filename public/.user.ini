; =============================================================================
; Limites PHP pour l'import de fichiers (module GED / pièces jointes).
; Lu automatiquement par PHP en FastCGI / PHP-FPM (cas des hébergements
; mutualisés type LWS). Placé dans public/ car c'est le dossier du script
; exécuté (public/index.php).
;
; /!\ Ajustez ces valeurs selon les quotas AUTORISÉS par l'hébergeur : sur
;     certains mutualisés, .user.ini est plafonné côté serveur. Vérifiez le
;     rendu réel via une page phpinfo() temporaire ou le panneau LWS.
;
; Règle importante : post_max_size >= upload_max_filesize, et suffisant pour
; la SOMME des fichiers d'un envoi multiple.
; =============================================================================

upload_max_filesize = 64M
post_max_size = 80M
max_file_uploads = 40
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
